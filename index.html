<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KASA</title>
<style>
:root{--ink:#14213d;--gold:#fcbf49;--paper:#fffaf0;--red:#c1121f;--green:#1b7f4b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
header{background:var(--ink);color:var(--gold);padding:28px 20px 22px}
h1{margin:0;font-size:3.4rem;letter-spacing:.04em;line-height:1}
header p{margin:6px 0 0;color:#fff;opacity:.85}
main{max-width:480px;margin:0 auto;padding:20px}
label{display:block;font-weight:600;margin:16px 0 6px}
input,select,textarea,button{width:100%;font:inherit;padding:12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:130px;resize:vertical}
button{background:var(--gold);font-weight:700;margin-top:18px;cursor:pointer}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#count{font-size:.85rem;text-align:right;margin-top:4px}
#msg{margin-top:14px;font-weight:600}
.err{color:var(--red)}.ok{color:var(--green)}
.hide{display:none}
</style>
</head>
<body>
<header><h1>KASA</h1><p>Message your students. No data needed on their side.</p></header>
<main>
  <section id="login">
    <label for="name">Rep name</label><input id="name" autocomplete="username">
    <label for="pin">PIN</label><input id="pin" type="password" autocomplete="current-password">
    <button id="loginBtn">Log in</button>
  </section>
  <section id="send" class="hide">
    <label for="group">Send to</label><select id="group"></select>
    <label for="text">Message</label><textarea id="text" maxlength="306"></textarea>
    <div id="count">0 / 306</div>
    <label for="when">Send later (optional, Ghana time)</label><input id="when" type="datetime-local">
    <button id="sendBtn">Send SMS</button>
    <hr style="margin:28px 0">
    <label>Recent sends</label>
    <div id="hist"></div>
    <hr style="margin:28px 0">
    <label for="gname">Add students to a group</label>
    <input id="gname" list="glist" placeholder="Group name, e.g. CS Year 2"><datalist id="glist"></datalist>
    <textarea id="nums" style="min-height:90px;margin-top:8px" placeholder="Paste numbers, separated by spaces, commas or new lines"></textarea>
    <button id="addBtn">Add students</button>
    <hr style="margin:28px 0">
    <label for="num">Student opt-out (number)</label><input id="num" inputmode="tel" placeholder="024 123 4567">
    <button id="outBtn">Opt out this number</button>
    <button id="inBtn" style="background:#fff">Opt back in</button>
  </section>
  <p id="msg" role="status"></p>
</main>
<script>
const $=id=>document.getElementById(id);
let creds={};
const say=(t,c)=>{$("msg").textContent=t;$("msg").className=c||""};
function setGroups(gs){
  const cur=$("group").value;
  const mk=(g,label)=>{const e=document.createElement("option");e.value=g.name;e.textContent=label;return e.outerHTML};
  $("group").innerHTML=gs.map(g=>mk(g,g.name+" ("+g.active+" of "+g.total+" active)")).join("");
  $("glist").innerHTML=gs.map(g=>mk(g,g.name)).join("");
  if(gs.some(g=>g.name===cur))$("group").value=cur;
}
async function call(body){
  const r=await fetch("/.netlify/functions/kasa",{method:"POST",body:JSON.stringify({...creds,...body})});
  const d=await r.json().catch(()=>({error:"Network error"}));
  if(!r.ok)throw new Error(d.error||"Something went wrong");
  return d;
}
$("loginBtn").onclick=async()=>{
  creds={name:$("name").value.trim(),pin:$("pin").value};
  $("loginBtn").disabled=true;say("");
  try{
    const d=await call({action:"login"});
    setGroups(d.groups);loadHist();
    $("login").classList.add("hide");$("send").classList.remove("hide");
  }catch(e){say(e.message,"err")}
  $("loginBtn").disabled=false;
};
$("text").oninput=()=>{$("count").textContent=$("text").value.length+" / 306"};
$("sendBtn").onclick=async()=>{
  $("sendBtn").disabled=true;say("Sending...");
  try{
    const d=await call({group:$("group").value,message:$("text").value,when:$("when").value});
    say((d.when?"Scheduled for "+d.when+" to ":"Sent to ")+d.sent+" students"+(d.skipped?" ("+d.skipped+" opted out).":"."),"ok");$("text").value="";$("when").value="";call({action:"login"}).then(r=>setGroups(r.groups)).catch(()=>{});loadHist();$("count").textContent="0 / 306";
  }catch(e){say(e.message,"err")}
  $("sendBtn").disabled=false;
};
async function loadHist(){
  try{
    const d=await call({action:"history"});
    $("hist").replaceChildren(...d.sends.map(x=>{
      const p=document.createElement("p");
      p.style.cssText="margin:0 0 10px;font-size:.9rem";
      p.textContent=new Date(x.created_at).toLocaleString("en-GB",{dateStyle:"short",timeStyle:"short"})+" | "+x.rep+" to "+x.group_name+" ("+x.recipients+"): "+x.message;
      return p;
    }));
    if(!d.sends.length)$("hist").textContent="No messages sent yet.";
  }catch(e){}
}
$("addBtn").onclick=async()=>{
  try{
    const d=await call({action:"add",group:$("gname").value,numbers:$("nums").value});
    setGroups(d.groups);$("nums").value="";
    say("Added "+d.added+" numbers"+(d.bad?" ("+d.bad+" invalid skipped).":"."),"ok");
  }catch(e){say(e.message,"err")}
};
for(const [id,a,t] of [["outBtn","optout","Number opted out."],["inBtn","optin","Number opted back in."]])
  $(id).onclick=async()=>{try{await call({action:a,number:$("num").value});say(t,"ok");$("num").value="";setGroups((await call({action:"login"})).groups)}catch(e){say(e.message,"err")}};
</script>
</body>
</html>
